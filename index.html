<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PulseCheck</title><link rel="stylesheet" href="styles.css"></head>
<body><header><div class="brand"><span class="dot"></span>PulseCheck</div><div id="apiState">Connecting…</div></header>
<main><section class="hero"><div><p class="eyebrow">UPTIME MONITORING</p><h1>Know when your<br><span>site goes down.</span></h1><p class="sub">Add a URL, track uptime, response time, history, and manually run checks.</p></div>
<form id="addForm" class="add"><h2>New monitor</h2><label>Website URL<input id="urlInput" placeholder="https://example.com" required></label><button id="addBtn">Add monitor →</button><p id="msg"></p></form></section>
<section class="stats"><article><small>Total monitors</small><strong id="total">—</strong></article><article><small>Online</small><strong id="up">—</strong></article><article><small>Offline</small><strong id="down">—</strong></article><article><small>Avg. response</small><strong id="avg">—</strong></article></section>
<section class="monitors"><div class="sectionHead"><div><p class="eyebrow">YOUR MONITORS</p><h2>Endpoints</h2></div><button id="refresh">Refresh</button></div><div id="list"></div></section></main>
<div id="toast"></div>
<script src="app.js"></script></body></html>
